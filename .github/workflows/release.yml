name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changeset:
    name: Changesets Version / Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Changesets CLI
        run: npm ci

      - name: Create Release PR or Tag Release
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          createGithubReleases: true
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve-release:
    name: Resolve Release Metadata
    needs: [changeset]
    if: |
      always() &&
      (needs.changeset.result == 'success' || needs.changeset.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || needs.changeset.outputs.published == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      minor: ${{ steps.meta.outputs.minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          PUBLISHED_PACKAGES: ${{ needs.changeset.outputs.publishedPackages }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -e 'const pkgs = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]"); if (!pkgs.length) process.exit(1); console.log(pkgs[0].version);')"
            TAG="v${VERSION}"
          fi
          CORE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR _ <<< "$CORE_VERSION"
          PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          fi
          OWNER_LC="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=${TAG} version=${VERSION} minor=${MAJOR}.${MINOR} prerelease=${PRERELEASE}"

      - name: Ensure GitHub Release exists for manual tag pushes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          node -e '
            const fs = require("fs");
            const ver = process.env.VERSION;
            const text = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const header = "## " + ver;
            const start = text.indexOf(header);
            if (start !== -1) {
              const after = text.slice(start + header.length).replace(/^\r?\n/, "");
              const next = after.search(/^## /m);
              const body = (next === -1 ? after : after.slice(0, next)).trim();
              if (body) fs.writeFileSync(process.argv[1], body + "\n");
            }
          ' "$NOTES_FILE"
          ARGS=(release create "$TAG" --title "$TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ -s "$NOTES_FILE" ]]; then
            ARGS+=(--notes-file "$NOTES_FILE")
          else
            ARGS+=(--generate-notes)
          fi
          gh "${ARGS[@]}"

  docker:
    name: Build & Push GHCR Images
    needs: [resolve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: osmium
          - target: agent
            image: osmium-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.resolve-release.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.resolve-release.outputs.version }}
            type=raw,value=${{ needs.resolve-release.outputs.tag }}
            type=raw,value=${{ needs.resolve-release.outputs.minor }},enable=${{ needs.resolve-release.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.resolve-release.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-

      - name: Build and Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.resolve-release.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  binaries:
    name: Build & Upload Release Binaries
    needs: [resolve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile release archives
        env:
          TAG: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          LDFLAGS="-s -w -X main.version=${TAG}"

          build_server() {
            local os="$1" arch="$2" ext=""
            if [[ "$os" == "windows" ]]; then ext=".exe"; fi
            local bin="osmium${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "dist-release/${bin}" ./cmd/osmium
            if [[ "$os" == "windows" ]]; then
              (cd dist-release && zip -q "osmium_${VERSION}_${os}_${arch}.zip" "$bin" && rm "$bin")
            else
              tar -C dist-release -czf "dist-release/osmium_${VERSION}_${os}_${arch}.tar.gz" "$bin"
              rm "dist-release/${bin}"
            fi
          }

          build_agent() {
            local os="$1" arch="$2" goarm="${3:-}" suffix="$arch"
            if [[ -n "$goarm" ]]; then suffix="armv${goarm}"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$goarm" go build -trimpath -ldflags "$LDFLAGS" -o "dist-release/osmium-agent" ./cmd/osmium-agent
            tar -C dist-release -czf "dist-release/osmium-agent_${VERSION}_${os}_${suffix}.tar.gz" osmium-agent
            rm dist-release/osmium-agent
          }

          build_server linux amd64
          build_server linux arm64
          build_server darwin amd64
          build_server darwin arm64
          build_server windows amd64

          build_agent linux amd64
          build_agent linux arm64
          build_agent linux arm 7

          (cd dist-release && sha256sum * > checksums.txt)

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          gh release upload "$TAG" dist-release/* --clobber
