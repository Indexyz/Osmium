name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v0.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changeset:
    name: Changesets Version / Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Changesets CLI
        run: npm ci

      - name: Create Release PR or Tag Release
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          createGithubReleases: true
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve-release:
    name: Resolve Release Metadata
    needs: [changeset]
    if: |
      always() &&
      !cancelled() &&
      (needs.changeset.result == 'success' || needs.changeset.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || needs.changeset.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISHED_PACKAGES: ${{ needs.changeset.outputs.publishedPackages }}
        run: |
          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="${INPUT_TAG#refs/tags/}"
            TAG="v${TAG#v}"
            VERSION="${TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -e 'const pkgs = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]"); if (!pkgs.length) process.exit(1); console.log(pkgs[0].version);')"
            TAG="v${VERSION}"
          fi
          PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=${TAG} version=${VERSION} prerelease=${PRERELEASE}"

      - name: Ensure GitHub Release exists for manual tag pushes
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          node -e '
            const fs = require("fs");
            const ver = process.env.VERSION;
            const text = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const header = "## " + ver;
            const start = text.indexOf(header);
            if (start !== -1) {
              const after = text.slice(start + header.length).replace(/^\r?\n/, "");
              const next = after.search(/^## /m);
              const body = (next === -1 ? after : after.slice(0, next)).trim();
              if (body) fs.writeFileSync(process.argv[1], body + "\n");
            }
          ' "$NOTES_FILE"
          ARGS=(release create "$TAG" --title "$TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ -s "$NOTES_FILE" ]]; then
            ARGS+=(--notes-file "$NOTES_FILE")
          else
            ARGS+=(--generate-notes)
          fi
          gh "${ARGS[@]}"

  goreleaser:
    name: GoReleaser (Binaries & GHCR Images)
    needs: [resolve-release]
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.resolve-release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web UI dependencies
        working-directory: web
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
